<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS CALC - Advanced Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Animated background gradient blobs -->
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="calculator-container" id="calculatorContainer">
        <!-- Brand Header -->
        <header class="calc-header">
            <div class="brand">
                <span class="logo-dot"></span>
                <h1>NEXUS <span class="accent-text">CALC</span></h1>
            </div>
            <div class="controls-right">
                <!-- Sound Toggle -->
                <button class="icon-btn" id="soundToggleBtn" title="Toggle Sound" aria-label="Toggle Sound">
                    <svg class="speaker-on-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                    <svg class="speaker-mute-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><polyline points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
                </button>
                <!-- Theme Toggle -->
                <button class="icon-btn" id="themeToggleBtn" title="Toggle Theme" aria-label="Toggle Theme">
                    <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
                    <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                </button>
                <!-- History Toggle -->
                <button class="icon-btn" id="historyToggleBtn" title="Calculation History" aria-label="Calculation History">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
                </button>
            </div>
        </header>

        <!-- Mode Indicator and Switcher -->
        <div class="mode-bar">
            <span class="mode-label active-mode" id="modeIndicatorText">Standard</span>
            <div class="toggle-switch-container">
                <input type="checkbox" id="modeSwitch" class="toggle-checkbox">
                <label for="modeSwitch" class="toggle-label">
                    <span class="toggle-ball"></span>
                </label>
            </div>
            <span class="mode-label" id="scientificLabel">Scientific</span>
        </div>

        <!-- Display Area -->
        <div class="display-wrapper">
            <div class="status-indicators">
                <span class="indicator" id="angleModeIndicator">DEG</span>
                <span class="indicator hidden" id="memoryIndicator">M</span>
            </div>
            <div class="expression-line" id="expressionDisplay"></div>
            <div class="result-line" id="resultDisplay">0</div>
        </div>

        <!-- Pad Grid Wrapper -->
        <div class="pad-wrapper">
            <!-- Scientific Keys Section -->
            <div class="keys-grid scientific-keys hidden" id="scientificKeys">
                <button class="btn sci-btn" data-action="angle-toggle" id="angleToggleBtn" title="Toggle Degrees/Radians">rad</button>
                <button class="btn sci-btn" data-action="math-func" data-val="sin(">sin</button>
                <button class="btn sci-btn" data-action="math-func" data-val="cos(">cos</button>
                <button class="btn sci-btn" data-action="math-func" data-val="tan(">tan</button>
                
                <button class="btn sci-btn" data-action="math-const" data-val="π">π</button>
                <button class="btn sci-btn" data-action="math-func" data-val="log(">log</button>
                <button class="btn sci-btn" data-action="math-func" data-val="ln(">ln</button>
                <button class="btn sci-btn" data-action="pow">x<sup>y</sup></button>
                
                <button class="btn sci-btn" data-action="math-const" data-val="e">e</button>
                <button class="btn sci-btn" data-action="math-func" data-val="√(">√</button>
                <button class="btn sci-btn" data-action="bracket-open" data-val="(">(</button>
                <button class="btn sci-btn" data-action="bracket-close" data-val=")">)</button>
            </div>

            <!-- Standard Keys Section -->
            <div class="keys-grid standard-keys">
                <button class="btn action-btn text-accent-red" data-action="clear" id="btnAC">AC</button>
                <button class="btn action-btn text-accent-purple" data-action="backspace" id="btnDel" title="Backspace">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="backspace-svg"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>
                </button>
                <button class="btn action-btn text-accent-purple" data-action="operator" data-val="%">%</button>
                <button class="btn operator-btn" data-action="operator" data-val="÷">÷</button>

                <button class="btn num-btn" data-val="7">7</button>
                <button class="btn num-btn" data-val="8">8</button>
                <button class="btn num-btn" data-val="9">9</button>
                <button class="btn operator-btn" data-action="operator" data-val="×">×</button>

                <button class="btn num-btn" data-val="4">4</button>
                <button class="btn num-btn" data-val="5">5</button>
                <button class="btn num-btn" data-val="6">6</button>
                <button class="btn operator-btn" data-action="operator" data-val="-">-</button>

                <button class="btn num-btn" data-val="1">1</button>
                <button class="btn num-btn" data-val="2">2</button>
                <button class="btn num-btn" data-val="3">3</button>
                <button class="btn operator-btn" data-action="operator" data-val="+">+</button>

                <button class="btn num-btn double-width" data-val="0">0</button>
                <button class="btn num-btn" data-val=".">.</button>
                <button class="btn equals-btn" data-action="calculate" id="btnEquals">=</button>
            </div>
        </div>

        <!-- Sliding History Drawer -->
        <aside class="history-drawer" id="historyDrawer">
            <div class="history-header">
                <h3>Calculation History</h3>
                <button class="icon-btn close-btn" id="closeHistoryBtn" aria-label="Close History">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="history-content" id="historyList">
                <div class="no-history">No calculations yet</div>
            </div>
            <div class="history-footer">
                <button class="btn-clear-history" id="clearHistoryBtn">Clear History</button>
            </div>
        </aside>
    </div>

    <!-- Sound Toggle Alert Box -->
    <div class="sound-toast" id="soundToast">
        <span>Click sound enabled</span>
    </div>

    <script src="script.js"></script>
</body>

</html>
